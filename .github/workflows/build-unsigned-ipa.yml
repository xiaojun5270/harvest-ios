name: Build Unsigned IPA

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS app without signing
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          xcodebuild -showsdks

      - name: Build unsigned app
        env:
          DERIVED_DATA: ${{ runner.temp }}/HarvestDerivedData
        run: |
          set -euo pipefail

          xcodebuild \
            -project Harvest.xcodeproj \
            -scheme Harvest \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            DEBUG_INFORMATION_FORMAT=dwarf \
            clean build

          APP_PATH="$DERIVED_DATA/Build/Products/Release-iphoneos/Harvest.app"
          test -d "$APP_PATH"

          EXTENSION_PATH="$APP_PATH/PlugIns/HarvestSafariExtension.appex"
          test -d "$EXTENSION_PATH"
          test -f "$EXTENSION_PATH/manifest.json"
          test -f "$EXTENSION_PATH/background.js"
          test -f "$EXTENSION_PATH/content-scripts/content.js"
          if grep -q "BEGIN PRIVATE KEY" "$EXTENSION_PATH/manifest.json"; then
            echo "Safari extension manifest unexpectedly contains a private key."
            exit 1
          fi

          mkdir -p output/Payload
          /usr/bin/ditto "$APP_PATH" output/Payload/Harvest.app
          (
            cd output
            /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Harvest-unsigned.ipa
          )

          if /usr/bin/codesign -dvv "$APP_PATH" >/dev/null 2>&1; then
            echo "The app is unexpectedly signed."
            exit 1
          else
            echo "Verified: Harvest.app has no code signature."
          fi

          shasum -a 256 output/Harvest-unsigned.ipa | tee output/Harvest-unsigned.ipa.sha256
          if unzip -Z1 output/Harvest-unsigned.ipa | grep -q '\.dSYM'; then
            echo "The IPA unexpectedly contains a dSYM bundle."
            exit 1
          fi
          ls -lh output/Harvest-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Harvest-unsigned-${{ github.run_number }}
          path: |
            output/Harvest-unsigned.ipa
            output/Harvest-unsigned.ipa.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Write summary
        run: |
          {
            echo "## Harvest unsigned IPA"
            echo
            echo "- Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "- Artifact: \`Harvest-unsigned.ipa\`"
            echo "- Signing: disabled"
            echo
            echo "This IPA must be signed before installation on a stock iOS device."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Harvest-unsigned-${{ github.run_number }}
          path: output

      - name: Publish tagged release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            output/Harvest-unsigned.ipa
            output/Harvest-unsigned.ipa.sha256
